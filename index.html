<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zaino</title>
  <!-- App installabile (PWA): manifest per Android, icona e titolo per iPhone -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#2b7a3d">
  <meta name="apple-mobile-web-app-title" content="Zaino">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; background: #f6f7f9; color: #222; }
    h1 { font-size: 1.3rem; }
    .progresso { font-size: 1.1rem; font-weight: 600; }
    details { background: #fff; border-radius: 10px; margin: 8px 0; padding: 8px 12px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    summary { font-weight: 600; font-size: 1.05rem; cursor: pointer; }
    label { display: block; padding: 8px 0 8px 8px; font-size: 1rem; }
    input[type=checkbox] { transform: scale(1.4); margin-right: 10px; }
    em { color: #888; font-size: .9rem; }
    button { width: 100%; padding: 14px; margin-top: 16px; font-size: 1.1rem; border: 0; border-radius: 10px; background: #2b7a3d; color: #fff; }
    button:disabled { background: #bbb; }
    .pronto, .riposo { font-size: 1.2rem; font-weight: 600; text-align: center; }
    .errore { color: #b00020; font-weight: 600; text-align: center; }
    h2 { font-size: 1.1rem; margin-top: 28px; }
    button.secondario { background: #e3e6ea; color: #222; }
    button.pericolo { background: #b00020; }
    .mancanti { background: #fff; border-radius: 10px; padding: 10px 10px 10px 30px; }
    .mancanti li { padding: 3px 0; }
    #form-orari { background: #fff; border-radius: 10px; padding: 8px 12px; }
    .nota { color: #666; font-size: .9rem; margin: 4px 0; }
    #esito-notifiche { text-align: left; font-size: .95rem; margin: 8px 0 0; }
    #esito-orari { text-align: left; font-size: 1rem; margin: 8px 0 0; }
    .installa { background: #fff8e1; border-radius: 10px; padding: 10px 12px; margin-top: 24px; font-size: .95rem; }
    .campo { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-left: 0; }
    .campo select { font-size: 1rem; padding: 6px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
    .campo input { font-size: 1rem; padding: 6px; border: 1px solid #ccc; border-radius: 8px; width: 7rem; }
    input#codice { width: 100%; padding: 12px; font-size: 1.1rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 10px; }
  </style>
</head>
<body>
  <p id="errore" class="errore" hidden></p>
  <div id="app">Caricamento…</div>
  <script src="app.js"></script>
</body>
</html>
