<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zaino</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; background: #f6f7f9; color: #222; }
    h1 { font-size: 1.3rem; }
    .progresso { font-size: 1.1rem; font-weight: 600; }
    details { background: #fff; border-radius: 10px; margin: 8px 0; padding: 8px 12px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    summary { font-weight: 600; font-size: 1.05rem; cursor: pointer; }
    label { display: block; padding: 8px 0 8px 8px; font-size: 1rem; }
    input[type=checkbox] { transform: scale(1.4); margin-right: 10px; }
    em { color: #888; font-size: .9rem; }
    button { width: 100%; padding: 14px; margin-top: 16px; font-size: 1.1rem; border: 0; border-radius: 10px; background: #2b7a3d; color: #fff; }
    button:disabled { background: #bbb; }
    .pronto, .riposo { font-size: 1.2rem; font-weight: 600; text-align: center; }
    .errore { color: #b00020; font-weight: 600; text-align: center; }
    input#codice { width: 100%; padding: 12px; font-size: 1.1rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 10px; }
  </style>
</head>
<body>
  <div id="app">Caricamento…</div>
  <script src="app.js"></script>
</body>
</html>
